<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusaTube</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    color:#111;
}

body.dark{
    background:#111;
    color:#fff;
}

header{
    height:65px;
    background:white;
    display:flex;
    align-items:center;
    gap:20px;
    padding:10px 20px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 8px #0002;
}

.dark header{
    background:#1b1b1b;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#ff0000;
    white-space:nowrap;
}

.search{
    flex:1;
    max-width:650px;
    display:flex;
}

.search input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:25px 0 0 25px;
    font-size:16px;
}

.search button{
    width:55px;
    border:1px solid #ccc;
    border-radius:0 25px 25px 0;
    cursor:pointer;
}

.profile{
    border-radius:50%;
    width:40px;
    height:40px;
    background:#673ab7;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

.layout{
    display:flex;
}

.sidebar{
    width:220px;
    position:fixed;
    top:65px;
    bottom:0;
    padding:15px;
    background:white;
    overflow:auto;
}

.dark .sidebar{
    background:#1b1b1b;
}

.sidebar button{
    width:100%;
    padding:13px;
    border:0;
    background:transparent;
    text-align:left;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    color:inherit;
}

.sidebar button:hover{
    background:#eee;
}

.dark .sidebar button:hover{
    background:#333;
}

.main{
    margin-left:220px;
    width:calc(100% - 220px);
    padding:20px;
}

.top-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.top-buttons button{
    padding:12px 18px;
    border:0;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
}

.post{
    background:#ff0000;
    color:white;
}

.screen{
    background:#673ab7;
    color:white;
}

.camera{
    background:#2196f3;
    color:white;
}

.categories{
    display:flex;
    gap:10px;
    overflow:auto;
    margin-bottom:20px;
}

.categories button{
    border:0;
    padding:10px 18px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
}

.videos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px #0002;
}

.dark .card{
    background:#1d1d1d;
}

.thumbnail{
    width:100%;
    height:175px;
    background:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    cursor:pointer;
    overflow:hidden;
}

.thumbnail video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card-content{
    padding:12px;
}

.title{
    font-weight:bold;
    margin-bottom:7px;
}

.channel{
    color:#777;
    font-size:14px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.actions button{
    border:0;
    background:#eee;
    padding:7px 10px;
    border-radius:18px;
    cursor:pointer;
}

.dark .actions button{
    background:#333;
    color:white;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000b;
    z-index:100;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modal-box{
    background:white;
    color:#111;
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    border-radius:15px;
    padding:25px;
}

.dark .modal-box{
    background:#222;
    color:white;
}

.modal-box h2{
    margin-bottom:15px;
}

.close{
    float:right;
    border:0;
    background:#eee;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

input,textarea,select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    height:100px;
    resize:vertical;
}

.modal-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
}

.modal-buttons button{
    padding:11px 16px;
    border:0;
    border-radius:8px;
    cursor:pointer;
}

.publish{
    background:#ff0000;
    color:white;
}

.record{
    background:#2196f3;
    color:white;
}

.stop{
    background:#333;
    color:white;
}

#cameraPreview,#screenPreview{
    width:100%;
    max-height:350px;
    background:#000;
    border-radius:10px;
    margin:10px 0;
}

.comments{
    margin-top:20px;
}

.comment{
    padding:10px;
    background:#eee;
    border-radius:10px;
    margin:8px 0;
}

.dark .comment{
    background:#333;
}

.empty{
    text-align:center;
    padding:60px;
    color:#777;
}

@media(max-width:700px){
    .sidebar{
        width:70px;
    }

    .sidebar button{
        font-size:0;
        text-align:center;
    }

    .sidebar button:first-letter{
        font-size:20px;
    }

    .main{
        margin-left:70px;
        width:calc(100% - 70px);
    }

    header{
        gap:8px;
    }

    .logo{
        font-size:18px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">▶ MusaTube</div>

    <div class="search">
        <input id="searchBox" placeholder="Search MusaTube..." oninput="searchVideos()">
        <button onclick="searchVideos()">🔍</button>
    </div>

    <div class="profile">M</div>
</header>

<div class="layout">

<aside class="sidebar">

<button onclick="showHome()">🏠 Home</button>
<button onclick="showTrending()">🔥 Trending</button>
<button onclick="showSubscriptions()">📺 Subscriptions</button>
<button onclick="showHistory()">🕒 History</button>
<button onclick="showLiked()">👍 Liked</button>
<button onclick="showSaved()">🔖 Watch later</button>

<hr style="margin:15px 0">

<button onclick="filterCategory('Gaming')">🎮 Gaming</button>
<button onclick="filterCategory('Minecraft')">⛏️ Minecraft</button>
<button onclick="filterCategory('Music')">🎵 Music</button>
<button onclick="filterCategory('Funny')">😂 Funny</button>
<button onclick="filterCategory('Shorts')">📱 Shorts</button>

<hr style="margin:15px 0">

<button onclick="toggleDark()">🌙 Dark mode</button>
<button onclick="openSettings()">⚙️ Settings</button>

</aside>

<main class="main">

<div class="top-buttons">
    <button class="post" onclick="openUpload()">➕ Upload Video</button>
    <button class="camera" onclick="openCamera()">🎥 Camera</button>
    <button class="screen" onclick="openScreen()">🖥️ Share Screen</button>
</div>

<div class="categories">
    <button onclick="showHome()">All</button>
    <button onclick="filterCategory('Gaming')">Gaming</button>
    <button onclick="filterCategory('Minecraft')">Minecraft</button>
    <button onclick="filterCategory('Music')">Music</button>
    <button onclick="filterCategory('Funny')">Funny</button>
    <button onclick="filterCategory('Shorts')">Shorts</button>
</div>

<h2 id="pageTitle">Recommended</h2>

<br>

<div id="videos" class="videos"></div>

</main>
</div>


<!-- UPLOAD MODAL -->

<div class="modal" id="uploadModal">

<div class="modal-box">

<button class="close" onclick="closeModal('uploadModal')">✕</button>

<h2>📤 Upload Video</h2>

<input type="file" id="videoFile" accept="video/*">

<input id="uploadTitle" placeholder="Video title">

<textarea id="uploadDescription" placeholder="Description"></textarea>

<select id="uploadCategory">
<option>Gaming</option>
<option>Minecraft</option>
<option>Music</option>
<option>Funny</option>
<option>Shorts</option>
<option>Learning</option>
</select>

<input type="file" id="thumbnailFile" accept="image/*">

<div class="modal-buttons">
<button class="publish" onclick="publishUpload()">🚀 Publish</button>
</div>

</div>
</div>


<!-- CAMERA MODAL -->

<div class="modal" id="cameraModal">

<div class="modal-box">

<button class="close" onclick="closeModal('cameraModal')">✕</button>

<h2>🎥 Record Camera</h2>

<video id="cameraPreview" autoplay muted></video>

<div class="modal-buttons">
<button class="record" onclick="startCamera()">🔴 Start</button>
<button class="stop" onclick="stopCamera()">⏹ Stop</button>
</div>

<input id="cameraTitle" placeholder="Video title">

<textarea id="cameraDescription" placeholder="Description"></textarea>

<select id="cameraCategory">
<option>Gaming</option>
<option>Funny</option>
<option>Shorts</option>
<option>Learning</option>
</select>

<button class="publish" onclick="publishCamera()">🚀 Publish Recording</button>

</div>
</div>


<!-- SCREEN MODAL -->

<div class="modal" id="screenModal">

<div class="modal-box">

<button class="close" onclick="closeModal('screenModal')">✕</button>

<h2>🖥️ Screen Recording</h2>

<video id="screenPreview" autoplay muted></video>

<div class="modal-buttons">
<button class="record" onclick="startScreen()">🔴 Start Recording</button>
<button class="stop" onclick="stopScreen()">⏹ Stop</button>
</div>

<input id="screenTitle" placeholder="Video title">

<textarea id="screenDescription" placeholder="Description"></textarea>

<button class="publish" onclick="publishScreen()">🚀 Publish Screen Recording</button>

</div>
</div>


<!-- WATCH MODAL -->

<div class="modal" id="watchModal">

<div class="modal-box">

<button class="close" onclick="closeModal('watchModal')">✕</button>

<video id="watchVideo" controls style="width:100%;background:#000;border-radius:10px"></video>

<h2 id="watchTitle"></h2>

<p id="watchDescription"></p>

<div class="actions">
<button onclick="likeCurrent()">👍 Like</button>
<button onclick="dislikeCurrent()">👎 Dislike</button>
<button onclick="saveCurrent()">🔖 Save</button>
<button onclick="shareCurrent()">🔗 Share</button>
</div>

<div class="comments">

<h3>💬 Comments</h3>

<input id="commentInput" placeholder="Write a comment...">

<button class="publish" onclick="addComment()">Comment</button>

<div id="commentList"></div>

</div>

</div>
</div>


<!-- SETTINGS -->

<div class="modal" id="settingsModal">

<div class="modal-box">

<button class="close" onclick="closeModal('settingsModal')">✕</button>

<h2>⚙️ Settings</h2>

<p>🎨 Theme</p>

<button onclick="toggleDark()">🌙 Toggle Dark Mode</button>

<br><br>

<p>👤 Channel</p>

<input id="channelName" value="Musa Gaming">

<button onclick="saveChannel()">Save Channel</button>

<br><br>

<button onclick="clearAll()">🗑️ Clear My Local Data</button>

</div>
</div>


<script>

let videos = [];

let currentVideo = null;

let cameraStream = null;
let cameraRecorder = null;
let cameraChunks = [];

let screenStream = null;
let screenRecorder = null;
let screenChunks = [];

let channel = localStorage.getItem("channel") || "Musa Gaming";


/* SAMPLE VIDEOS */

videos = [

{
id:1,
title:"Minecraft PvP Challenge 🔥",
description:"Amazing Minecraft PvP battle!",
category:"Minecraft",
channel:"Musa Gaming",
views:1240,
likes:120,
dislikes:5,
video:"",
comments:[]
},

{
id:2,
title:"Crazy Gaming Moment 😂",
description:"You won't believe what happened!",
category:"Gaming",
channel:"Musa Gaming",
views:980,
likes:80,
dislikes:3,
video:"",
comments:[]
},

{
id:3,
title:"My New Song 🎵",
description:"A new music video.",
category:"Music",
channel:"Musa Music",
views:2300,
likes:210,
dislikes:8,
video:"",
comments:[]
}

];

let userVideos = JSON.parse(localStorage.getItem("userVideos") || "[]");

videos = videos.concat(userVideos);


/* DISPLAY VIDEOS */

function displayVideos(list=videos){

const box=document.getElementById("videos");

box.innerHTML="";

if(list.length===0){

box.innerHTML='<div class="empty">😢 No videos found</div>';

return;

}

list.forEach(v=>{

const card=document.createElement("div");

card.className="card";

let thumbnail="";

if(v.video){

thumbnail=`<video src="${v.video}" muted></video>`;

}else{

thumbnail=`<div style="font-size:45px">▶️</div>`;

}

card.innerHTML=`

<div class="thumbnail" onclick="watchVideo(${v.id})">
${thumbnail}
</div>

<div class="card-content">

<div class="title">${escapeHTML(v.title)}</div>

<div class="channel">👤 ${escapeHTML(v.channel)}</div>

<div class="channel">
${v.views} views • ${v.category}
</div>

<div class="actions">

<button onclick="event.stopPropagation();likeVideo(${v.id})">
👍 ${v.likes}
</button>

<button onclick="event.stopPropagation();saveVideo(${v.id})">
🔖
</button>

<button onclick="event.stopPropagation();shareVideo(${v.id})">
🔗
</button>

</div>

</div>
`;

box.appendChild(card);

});

}


/* UPLOAD */

function openUpload(){

document.getElementById("uploadModal").style.display="flex";

}

function publishUpload(){

const file=document.getElementById("videoFile").files[0];

const title=document.getElementById("uploadTitle").value.trim();

const description=document.getElementById("uploadDescription").value.trim();

const category=document.getElementById("uploadCategory").value;

if(!file){

alert("Choose a video first!");

return;

}

if(!title){

alert("Enter a title!");

return;

}

const url=URL.createObjectURL(file);

const video={

id:Date.now(),

title:title,

description:description,

category:category,

channel:channel,

views:0,

likes:0,

dislikes:0,

video:url,

comments:[]

};

videos.unshift(video);

saveUserVideos();

displayVideos();

closeModal("uploadModal");

alert("🎉 Video posted!");

}


/* CAMERA */

function openCamera(){

document.getElementById("cameraModal").style.display="flex";

}

async function startCamera(){

try{

cameraStream=await navigator.mediaDevices.getUserMedia({

video:true,
audio:true

});

document.getElementById("cameraPreview").srcObject=cameraStream;

cameraChunks=[];

cameraRecorder=new MediaRecorder(cameraStream);

cameraRecorder.ondataavailable=e=>{

if(e.data.size>0) cameraChunks.push(e.data);

};

cameraRecorder.start();

}catch(e){

alert("Camera permission was denied or camera is unavailable.");

}

}

function stopCamera(){

if(!cameraRecorder)return;

cameraRecorder.stop();

cameraStream.getTracks().forEach(track=>track.stop());

}

function publishCamera(){

if(cameraChunks.length===0){

alert("Record something first!");

return;

}

const blob=new Blob(cameraChunks,{type:"video/webm"});

const url=URL.createObjectURL(blob);

const title=document.getElementById("cameraTitle").value || "My Camera Video";

const description=document.getElementById("cameraDescription").value;

const category=document.getElementById("cameraCategory").value;

const video={

id:Date.now(),

title:title,

description:description,

category:category,

channel:channel,

views:0,

likes:0,

dislikes:0,

video:url,

comments:[]

};

videos.unshift(video);

saveUserVideos();

displayVideos();

closeModal("cameraModal");

alert("🎥 Camera video posted!");

}


/* SCREEN RECORDING */

function openScreen(){

document.getElementById("screenModal").style.display="flex";

}

async function startScreen(){

try{

screenStream=await navigator.mediaDevices.getDisplayMedia({

video:true,
audio:true

});

document.getElementById("screenPreview").srcObject=screenStream;

screenChunks=[];

screenRecorder=new MediaRecorder(screenStream);

screenRecorder.ondataavailable=e=>{

if(e.data.size>0) screenChunks.push(e.data);

};

screenRecorder.start();

screenStream.getVideoTracks()[0].onended=()=>{

stopScreen();

};

}catch(e){

alert("Screen sharing was cancelled.");

}

}

function stopScreen(){

if(!screenRecorder)return;

screenRecorder.stop();

if(screenStream){

screenStream.getTracks().forEach(track=>track.stop());

}

}

function publishScreen(){

if(screenChunks.length===0){

alert("Record your screen first!");

return;

}

const blob=new Blob(screenChunks,{type:"video/webm"});

const url=URL.createObjectURL(blob);

const title=document.getElementById("screenTitle").value || "My Screen Recording";

const description=document.getElementById("screenDescription").value;

const video={

id:Date.now(),

title:title,

description:description,

category:"Gaming",

channel:channel,

views:0,

likes:0,

dislikes:0,

video:url,

comments:[]

};

videos.unshift(video);

saveUserVideos();

displayVideos();

closeModal("screenModal");

alert("🖥️ Screen recording posted!");

}


/* WATCH */

function watchVideo(id){

const v=videos.find(x=>x.id===id);

if(!v)return;

currentVideo=v;

v.views++;

document.getElementById("watchVideo").src=v.video;

document.getElementById("watchTitle").textContent=v.title;

document.getElementById("watchDescription").textContent=v.description;

showComments();

document.getElementById("watchModal").style.display="flex";

saveUserVideos();

}

function showComments(){

const list=document.getElementById("commentList");

list.innerHTML="";

if(!currentVideo.comments.length){

list.innerHTML="<p>No comments yet. Be the first!</p>";

return;

}

currentVideo.comments.forEach((c,i)=>{

const div=document.createElement("div");

div.className="comment";

div.innerHTML=`

<b>${escapeHTML(c.name)}</b><br>

${escapeHTML(c.text)}

<br>

<button onclick="likeComment(${i})">
❤️ ${c.likes}
</button>

`;

list.appendChild(div);

});

}

function addComment(){

const text=document.getElementById("commentInput").value.trim();

if(!text)return;

currentVideo.comments.push({

name:channel,
text:text,
likes:0

});

document.getElementById("commentInput").value="";

showComments();

saveUserVideos();

}

function likeComment(i){

currentVideo.comments[i].likes++;

showComments();

saveUserVideos();

}


/* LIKES */

function likeCurrent(){

currentVideo.likes++;

saveUserVideos();

alert("👍 Liked!");

}

function dislikeCurrent(){

currentVideo.dislikes++;

saveUserVideos();

alert("👎 Disliked!");

}

function likeVideo(id){

const v=videos.find(x=>x.id===id);

v.likes++;

saveUserVideos();

displayVideos();

}


/* SAVE */

function saveCurrent(){

let saved=JSON.parse(localStorage.getItem("saved")||"[]");

if(!saved.includes(currentVideo.id)){

saved.push(currentVideo.id);

localStorage.setItem("saved",JSON.stringify(saved));

alert("🔖 Saved!");

}else{

alert("Already saved!");

}

}

function saveVideo(id){

let saved=JSON.parse(localStorage.getItem("saved")||"[]");

if(!saved.includes(id)){

saved.push(id);

localStorage.setItem("saved",JSON.stringify(saved));

}

alert("🔖 Added to Watch Later");

}


/* SHARE */

function shareCurrent(){

shareVideo(currentVideo.id);

}

function shareVideo(id){

const link=location.href+"#video-"+id;

if(navigator.share){

navigator.share({

title:"MusaTube Video",
url:link

});

}else{

navigator.clipboard.writeText(link);

alert("🔗 Video link copied!");

}

}


/* SEARCH */

function searchVideos(){

const q=document.getElementById("searchBox").value.toLowerCase();

const results=videos.filter(v=>

v.title.toLowerCase().includes(q) ||

v.description.toLowerCase().includes(q) ||

v.category.toLowerCase().includes(q) ||

v.channel.toLowerCase().includes(q)

);

document.getElementById("pageTitle").textContent=

q ? "Search results" : "Recommended";

displayVideos(results);

}


/* CATEGORIES */

function filterCategory(category){

document.getElementById("pageTitle").textContent=category;

displayVideos(videos.filter(v=>v.category===category));

}


/* HOME */

function showHome(){

document.getElementById("pageTitle").textContent="Recommended";

displayVideos(videos);

}


/* TRENDING */

function showTrending(){

document.getElementById("pageTitle").textContent="🔥 Trending";

const sorted=[...videos].sort((a,b)=>

(b.views+b.likes*5)-(a.views+a.likes*5)

);

displayVideos(sorted);

}


/* SUBSCRIPTIONS */

function showSubscriptions(){

document.getElementById("pageTitle").textContent="📺 Subscriptions";

displayVideos(videos.filter(v=>v.channel===channel));

}


/* HISTORY */

function showHistory(){

const history=JSON.parse(localStorage.getItem("history")||"[]");

displayVideos(videos.filter(v=>history.includes(v.id)));

}


/* LIKED */

function showLiked(){

displayVideos(videos.filter(v=>v.likes>0));

}


/* SAVED */

function showSaved(){

const saved=JSON.parse(localStorage.getItem("saved")||"[]");

displayVideos(videos.filter(v=>saved.includes(v.id)));

}


/* DARK MODE */

function toggleDark(){

document.body.classList.toggle("dark");

localStorage.setItem(

"dark",

document.body.classList.contains("dark")

);

}


/* SETTINGS */

function openSettings(){

document.getElementById("settingsModal").style.display="flex";

}

function saveChannel(){

channel=document.getElementById("channelName").value || "Musa Gaming";

localStorage.setItem("channel",channel);

alert("Channel saved!");

}


/* CLOSE */

function closeModal(id){

document.getElementById(id).style.display="none";

}


/* SAVE USER VIDEOS */

function saveUserVideos(){

localStorage.setItem(

"userVideos",

JSON.stringify(

videos.filter(v=>v.id>3)

)

);

}


/* CLEAR */

function clearAll(){

if(confirm("Delete your local MusaTube data?")){

localStorage.clear();

location.reload();

}

}


/* SECURITY */

function escapeHTML(text){

return String(text)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* START */

if(localStorage.getItem("dark")==="true"){

document.body.classList.add("dark");

}

displayVideos();

</script>

</body>
</html>
