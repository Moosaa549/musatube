<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MusaTube</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
    transition:.3s;
}

/* DARK MODE */

body.dark{
    background:#0f0f0f;
    color:white;
}

body.dark header,
body.dark .sidebar,
body.dark .card,
body.dark .modal-content,
body.dark .player-content{
    background:#181818;
    color:white;
}

body.dark button{
    color:white;
}

/* HEADER */

header{
    height:65px;
    background:white;
    border-bottom:1px solid #ddd;

    display:flex;
    align-items:center;

    padding:0 20px;

    position:sticky;
    top:0;

    z-index:50;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#ff0000;
    white-space:nowrap;
}

.search{
    display:flex;
    width:45%;
    margin-left:70px;
}

.search input{
    width:100%;
    padding:12px 18px;

    border:1px solid #ccc;
    border-radius:25px 0 0 25px;

    font-size:16px;
}

.search button{
    width:60px;

    border:1px solid #ccc;
    border-radius:0 25px 25px 0;

    cursor:pointer;
}

.header-buttons{
    margin-left:auto;
    display:flex;
    gap:10px;
    align-items:center;
}

.header-buttons button{
    border:none;
    background:#eee;

    padding:10px 14px;

    border-radius:20px;
    cursor:pointer;
}

.post-button{
    background:#ff0000 !important;
    color:white !important;
}

/* SIDEBAR */

.sidebar{
    position:fixed;

    left:0;
    top:65px;

    width:210px;

    height:calc(100vh - 65px);

    background:white;

    padding:15px 10px;

    overflow-y:auto;
}

.sidebar button{
    width:100%;

    border:none;
    background:white;

    padding:14px;

    text-align:left;

    font-size:16px;

    border-radius:10px;

    cursor:pointer;

    margin-bottom:3px;
}

.sidebar button:hover{
    background:#eee;
}

/* CONTENT */

.content{
    margin-left:230px;
    padding:25px;
}

.categories{
    display:flex;

    gap:10px;

    overflow-x:auto;

    margin-bottom:25px;
}

.categories button{
    border:none;

    background:#e5e5e5;

    padding:10px 18px;

    border-radius:20px;

    cursor:pointer;

    white-space:nowrap;
}

/* VIDEO GRID */

.videos{
    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));

    gap:25px;
}

/* VIDEO CARD */

.card{
    background:white;

    border-radius:14px;

    overflow:hidden;

    box-shadow:0 2px 8px #ddd;

    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
}

.thumbnail{
    width:100%;

    height:180px;

    object-fit:cover;

    background:#111;

    cursor:pointer;
}

.info{
    padding:13px;
}

.title{
    font-size:18px;
    font-weight:bold;

    margin-bottom:7px;
}

.channel{
    color:#777;
    margin-bottom:6px;
}

.stats{
    color:#777;
    font-size:14px;
}

.actions{
    display:flex;

    gap:7px;

    margin-top:12px;

    flex-wrap:wrap;
}

.actions button{
    border:none;

    background:#eee;

    padding:8px 12px;

    border-radius:20px;

    cursor:pointer;
}

.actions button:hover{
    background:#ddd;
}

/* MODALS */

.modal{
    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    z-index:100;

    align-items:center;

    justify-content:center;
}

.modal-content{
    width:520px;

    max-width:95%;

    max-height:90vh;

    overflow-y:auto;

    background:white;

    border-radius:18px;

    padding:25px;
}

.modal-content h2{
    margin-bottom:20px;
}

.modal-content input,
.modal-content textarea,
.modal-content select{
    width:100%;

    padding:12px;

    margin-bottom:12px;

    border:1px solid #ccc;

    border-radius:9px;

    font-size:15px;
}

.modal-content textarea{
    height:90px;

    resize:none;
}

.modal-buttons{
    display:flex;
    gap:10px;
}

.modal-buttons button{
    padding:12px 18px;

    border:none;

    border-radius:20px;

    cursor:pointer;
}

.red{
    background:red;
    color:white;
}

.gray{
    background:#ddd;
}

/* CAMERA */

#camera{
    width:100%;

    background:black;

    border-radius:12px;

    margin-bottom:15px;
}

.camera-buttons{
    display:flex;

    gap:8px;

    flex-wrap:wrap;
}

.camera-buttons button{
    padding:11px 16px;

    border:none;

    border-radius:20px;

    cursor:pointer;
}

#recorded{
    display:none;

    width:100%;

    margin-top:15px;
}

/* VIDEO PLAYER */

#videoPlayerModal{
    background:rgba(0,0,0,.95);
}

.player-content{
    width:900px;
    max-width:95%;

    background:#111;

    color:white;

    padding:20px;

    border-radius:15px;
}

#bigVideo{
    width:100%;

    max-height:65vh;

    background:black;
}

.player-title{
    font-size:22px;

    font-weight:bold;

    margin-top:12px;
}

/* COMMENTS */

.comment-box{
    margin-top:20px;

    border-top:1px solid #444;

    padding-top:15px;
}

.comment-input{
    display:flex;
    gap:8px;
}

.comment-input input{
    flex:1;

    padding:12px;

    border-radius:20px;

    border:1px solid #777;
}

.comment-input button{
    border:none;

    background:red;

    color:white;

    padding:10px 16px;

    border-radius:20px;

    cursor:pointer;
}

.comment{
    padding:13px 0;

    border-bottom:1px solid #333;
}

.comment-user{
    font-weight:bold;

    margin-bottom:5px;
}

.comment-text{
    margin-bottom:8px;
}

.comment-actions button{
    border:none;

    background:transparent;

    color:#aaa;

    cursor:pointer;

    margin-right:10px;
}

/* PROFILE */

.profile-box{
    text-align:center;

    padding:15px;
}

.avatar{
    width:90px;
    height:90px;

    border-radius:50%;

    background:linear-gradient(135deg,#ff0000,#8000ff);

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    font-size:40px;

    margin:auto auto 15px;
}

.subscribe{
    border:none;

    background:red;

    color:white;

    padding:11px 20px;

    border-radius:22px;

    cursor:pointer;
}

/* NOTIFICATION */

.notification{
    position:fixed;

    right:20px;
    bottom:20px;

    background:#222;

    color:white;

    padding:15px 20px;

    border-radius:10px;

    display:none;

    z-index:300;
}

/* MOBILE */

@media(max-width:750px){

    .sidebar{
        display:none;
    }

    .content{
        margin-left:0;
        padding:15px;
    }

    .search{
        margin-left:15px;
        width:35%;
    }

    .logo{
        font-size:19px;
    }

    .header-buttons button{
        padding:8px;
    }

}

</style>
</head>

<script>

/* DATA */

let videos =
JSON.parse(
localStorage.getItem("musatube_data")
) || [];

let favorites =
JSON.parse(
localStorage.getItem("musatube_favorites")
) || [];

let watchLater =
JSON.parse(
localStorage.getItem("musatube_watchlater")
) || [];

let history =
JSON.parse(
localStorage.getItem("musatube_history")
) || [];

let currentVideo = null;

let cameraStream = null;

let recorder = null;

let chunks = [];

let recordedURL = null;

let subscribers =
Number(
localStorage.getItem("musatube_subscribers")
) || 0;


/* SAVE */

function save(){

localStorage.setItem(
"musatube_data",
JSON.stringify(videos)
);

localStorage.setItem(
"musatube_favorites",
JSON.stringify(favorites)
);

localStorage.setItem(
"musatube_watchlater",
JSON.stringify(watchLater)
);

localStorage.setItem(
"musatube_history",
JSON.stringify(history)
);

localStorage.setItem(
"musatube_subscribers",
subscribers
);

}


/* CAMERA */

async function openCamera(){

document.getElementById(
"cameraModal"
).style.display="flex";

try{

cameraStream =
await navigator.mediaDevices.getUserMedia({

video:true,
audio:true

});

document.getElementById(
"camera"
).srcObject =
cameraStream;

}catch(e){

alert(
"Please allow camera and microphone access."
);

}

}


function startRecording(){

if(!cameraStream){

alert("Camera is not ready!");

return;

}

chunks=[];

recorder =
new MediaRecorder(cameraStream);

recorder.ondataavailable =
e=>{

if(e.data.size>0)
chunks.push(e.data);

};

recorder.onstop=()=>{

let blob =
new Blob(
chunks,
{type:"video/webm"}
);

recordedURL =
URL.createObjectURL(blob);

let recorded =
document.getElementById(
"recorded"
);

recorded.src =
recordedURL;

recorded.style.display="block";

document.getElementById(
"postForm"
).style.display="block";

};

recorder.start();

notify("🔴 Recording started!");

}


function stopRecording(){

if(
recorder &&
recorder.state!=="inactive"
){

recorder.stop();

notify("⏹ Recording stopped!");

}

}


/* PUBLISH */

function publishVideo(){

let title =
document.getElementById(
"newTitle"
).value.trim();

let description =
document.getElementById(
"newDescription"
).value.trim();

let category =
document.getElementById(
"newCategory"
).value;

if(!recordedURL){

alert("Record a video first!");

return;

}

if(!title){

alert("Enter a title!");

return;

}

let video={

id:Date.now(),

title:title,

description:description,

category:category,

url:recordedURL,

likes:0,

dislikes:0,

views:0,

comments:[],

date:new Date().toLocaleDateString()

};

videos.unshift(video);

save();

displayVideos();

closeCamera();

notify("🎉 Video published!");

}


/* DISPLAY */

function displayVideos(list=videos){

let box =
document.getElementById("videos");

box.innerHTML="";

if(list.length===0){

box.innerHTML=
"<h2>No videos found 😢</h2>";

return;

}

list.forEach(video=>{

let card =
document.createElement("div");

card.className="card";

card.dataset.id=video.id;

card.innerHTML=`

<video
class="thumbnail"
src="${video.url}"
onclick="openPlayer(${video.id})">
</video>

<div class="info">

<div class="title">
${escapeHTML(video.title)}
</div>

<div class="channel">
👤 Musa
</div>

<div class="stats">
${video.views} views • ${video.date}
</div>

<div class="actions">

<button onclick="likeVideo(${video.id})">
❤️ ${video.likes}
</button>

<button onclick="openPlayer(${video.id})">
💬 ${video.comments.length}
</button>

<button onclick="addFavorite(${video.id})">
⭐
</button>

<button onclick="addWatchLater(${video.id})">
🔖
</button>

<button onclick="deleteVideo(${video.id})">
🗑
</button>

</div>

</div>
`;

box.appendChild(card);

});

}


/* PLAYER */

function openPlayer(id){

let video =
videos.find(v=>v.id===id);

if(!video)return;

currentVideo=id;

video.views++;

if(!history.includes(id)){

history.unshift(id);

}

save();

document.getElementById(
"bigVideo"
).src=video.url;

document.getElementById(
"bigTitle"
).innerText=video.title;

document.getElementById(
"bigStats"
).innerText=
video.views+" views • "+video.date;

document.getElementById(
"videoPlayerModal"
).style.display="flex";

displayComments();

}


function closePlayer(){

let player =
document.getElementById(
"bigVideo"
);

player.pause();

player.src="";

document.getElementById(
"videoPlayerModal"
).style.display="none";

}


/* LIKE */

function likeVideo(id){

let video =
videos.find(v=>v.id===id);

if(video){

video.likes++;

save();

displayVideos();

}

}


function playerLike(){

likeVideo(currentVideo);

}


function playerDislike(){

let video =
videos.find(v=>v.id===currentVideo);

if(video){

video.dislikes++;

save();

notify("👎 Disliked");

}

}


/* FAVORITES */

function addFavorite(id){

if(!favorites.includes(id)){

favorites.push(id);

notify("⭐ Added to favorites!");

}else{

favorites =
favorites.filter(x=>x!==id);

notify("Removed from favorites");

}

save();

}


function playerFavorite(){

addFavorite(currentVideo);

}


/* WATCH LATER */

function addWatchLater(id){

if(!watchLater.includes(id)){

watchLater.push(id);

notify("🔖 Added to Watch Later!");

}else{

watchLater =
watchLater.filter(x=>x!==id);

}

save();

}


function playerWatchLater(){

addWatchLater(currentVideo);

}


/* COMMENTS */

function addComment(){

let input =
document.getElementById(
"commentInput"
);

let text =
input.value.trim();

if(!text)return;

let video =
videos.find(
v=>v.id===currentVideo
);

video.comments.push({

id:Date.now(),

user:"Musa",

text:text,

likes:0,

pinned:false

});

input.value="";

save();

displayComments();

}


function displayComments(){

let video =
videos.find(
v=>v.id===currentVideo
);

let box =
document.getElementById(
"comments"
);

box.innerHTML="";

if(!video.comments.length){

box.innerHTML=
"<p style='color:#aaa'>No comments yet. Be the first! 💬</p>";

return;

}

video.comments
.slice()
.sort((a,b)=>
Number(b.pinned)-Number(a.pinned)
)
.forEach(comment=>{

let div =
document.createElement("div");

div.className="comment";

div.innerHTML=`

<div class="comment-user">
${comment.pinned?"📌 ":""}👤 ${escapeHTML(comment.user)}
</div>

<div class="comment-text">
${escapeHTML(comment.text)}
</div>

<div class="comment-actions">

<button onclick="likeComment(${comment.id})">
❤️ ${comment.likes}
</button>

<button onclick="pinComment(${comment.id})">
📌 Pin
</button>

</div>

`;

box.appendChild(div);

});

}


function likeComment(id){

let video =
videos.find(v=>v.id===currentVideo);

let comment =
video.comments.find(
c=>c.id===id
);

if(comment){

comment.likes++;

save();

displayComments();

}

}


function pinComment(id){

let video =
videos.find(v=>v.id===currentVideo);

video.comments.forEach(
c=>c.pinned=false
);

let comment =
video.comments.find(
c=>c.id===id
);

if(comment)
comment.pinned=true;

save();

displayComments();

}


/* SEARCH */

function searchVideos(){

let text =
document.getElementById(
"searchInput"
).value.toLowerCase();

let results =
videos.filter(v=>
v.title.toLowerCase()
.includes(text)
);

document.getElementById(
"pageTitle"
).innerText=
"Search Results";

displayVideos(results);

}


/* CATEGORY */

function filterCategory(category){

let results =
videos.filter(
v=>v.category===category
);

document.getElementById(
"pageTitle"
).innerText=
category+" Videos";

displayVideos(results);

}


/* HOME */

function showHome(){

document.getElementById(
"pageTitle"
).innerText=
"Recommended Videos";

displayVideos();

}


/* TRENDING */

function showTrending(){

let results =
[...videos]
.sort(
(a,b)=>
(b.likes+b.views)-
(a.likes+a.views)
);

document.getElementById(
"pageTitle"
).innerText=
"🔥 Trending";

displayVideos(results);

}


/* SHORTS */

function showShorts(){

let results =
videos.filter(
v=>v.category==="Shorts"
);

document.getElementById(
"pageTitle"
).innerText=
"⚡ Shorts";

displayVideos(results);

}


/* FAVORITES */

function showFavorites(){

let results =
videos.filter(
v=>favorites.includes(v.id)
);

document.getElementById(
"pageTitle"
).innerText=
"⭐ Favorites";

displayVideos(results);

}


/* WATCH LATER */

function showWatchLater(){

let results =
videos.filter(
v=>watchLater.includes(v.id)
);

document.getElementById(
"pageTitle"
).innerText=
"🔖 Watch Later";

displayVideos(results);

}


/* HISTORY */

function showHistory(){

let results =
history.map(
id=>videos.find(v=>v.id===id)
).filter(Boolean);

document.getElementById(
"pageTitle"
).innerText=
"🕐 Watch History";

displayVideos(results);

}


/* DELETE */

function deleteVideo(id){

if(
!confirm(
"Delete this video?"
)
)return;

videos =
videos.filter(
v=>v.id!==id
);

save();

displayVideos();

notify("🗑 Video deleted");

}


/* SHARE */

function shareVideo(){

navigator.clipboard.writeText(
window.location.href
);

notify("🔗 Link copied!");

}


/* DARK MODE */

function toggleDark(){

document.body.classList.toggle("dark");

localStorage.setItem(
"darkmode",
document.body.classList.contains("dark")
);

}


/* PROFILE */

function openProfile(){

document.getElementById(
"profileModal"
).style.display="flex";

document.getElementById(
"subscriberCount"
).innerText=
subscribers+" subscribers";

}


function closeProfile(){

document.getElementById(
"profileModal"
).style.display="none";

}


function subscribe(){

subscribers++;

document.getElementById(
"subscriberCount"
).innerText=
subscribers+" subscribers";

document.getElementById(
"subscribeButton"
).innerText=
"Subscribed ✓";

save();

notify("🔔 Subscribed!");

}


/* NOTIFICATIONS */

function showNotifications(){

notify(
"🔔 No new notifications"
);

}


/* CLOSE CAMERA */

function closeCamera(){

if(cameraStream){

cameraStream
.getTracks()
.forEach(
track=>track.stop()
);

}

document.getElementById(
"cameraModal"
).style.display="none";

document.getElementById(
"postForm"
).style.display="none";

document.getElementById(
"recorded"
).style.display="none";

document.getElementById(
"newTitle"
).value="";

document.getElementById(
"newDescription"
).value="";

}


/* NOTIFICATION */

function notify(message){

let box =
document.getElementById(
"notification"
);

box.innerText=message;

box.style.display="block";

setTimeout(
()=>box.style.display="none",
2500
);

}


/* SECURITY */

function escapeHTML(text){

return text
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* DARK MODE LOAD */

if(
localStorage.getItem("darkmode")
==="true"
){

document.body.classList.add("dark");

}


/* START */

displayVideos();

</script>

</body>
</html>
